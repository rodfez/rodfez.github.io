    <ellipse cx="140" cy="165" rx="6" ry="3" fill="rgba(255,255,255,0.5)" transform="rotate(-30 140 165)"/>
  </svg>
 
  <div class="hero-content">
    <p class="eyebrow">✦ La misión de rodfez</p>
    <h1>La <em>paz</em> se sirve<br>con omelet perfecto</h1>
    <p class="hero-sub">
      Creo que el camino hacia un mundo más tranquilo empieza en la cocina — en el ritual de preparar algo simple, con atención y amor. Soy rodfez y esto es lo que busco.
    </p>
    <div class="btn-group">
      <a href="#manifiesto" class="btn btn-primary">Leer el manifiesto</a>
      <a href="#omelets" class="btn btn-secondary">Ver omelets ↓</a>
    </div>
  </div>
 
  <div class="hero-scroll">Scroll para explorar</div>
</section>
 
 
<!-- ═══ PAZ ═══ -->
<section class="paz" id="paz">
  <div class="paz-grid reveal">
    <div>
      <p class="section-label">☮ La búsqueda</p>
      <h2>Paz no es ausencia de ruido.<br>Es presencia plena.</h2>
      <p style="margin-top:1.2rem;">
        Vivo convencido de que la paz no es un destino lejano — es una práctica diaria. Se construye en los pequeños actos: escuchar de verdad, cocinar con calma, respirar antes de reaccionar.
      </p>
    </div>
    <div class="peace-pillars">
      <div class="pillar">
        <div class="pillar-icon">🌱</div>
        <div>
          <h3>Presencia</h3>
          <p>Estar aquí, ahora. Sin el teléfono, sin el ruido mental. Solo el momento.</p>
        </div>
      </div>
      <div class="pillar">
        <div class="pillar-icon">🤝</div>
        <div>
          <h3>Conexión genuina</h3>
          <p>La paz entre personas nace cuando nos vemos como humanos, no como obstáculos.</p>
        </div>
      </div>
      <div class="pillar">
        <div class="pillar-icon">🍳</div>
        <div>
          <h3>Ritual cotidiano</h3>
          <p>Hasta preparar el desayuno puede ser un acto meditativo si lo hacemos con intención.</p>
        </div>
      </div>
      <div class="pillar">
        <div class="pillar-icon">🌍</div>
        <div>
          <h3>Escala global</h3>
          <p>Lo que se practica en casa se irradia al mundo. Millones de cocinas en paz = un planeta en paz.</p>
        </div>
      </div>
    </div>
  </div>
</section>
 
 
<!-- ═══ OMELETS ═══ -->
<section class="omelet" id="omelets">
  <div class="omelet-header reveal">
    <div>
      <p class="section-label">🍳 El arte del omelet</p>
      <h2>Tres omelets.<br>Un camino.</h2>
    </div>
    <p>Cada omelet es una filosofía. Preparar uno bien requiere lo mismo que alcanzar la paz: paciencia, temperatura correcta y no apresurarse.</p>
  </div>
 
  <div class="recipe-cards">
    <div class="card reveal">
      <div class="card-thumb card-thumb-1">🥚</div>
      <div class="card-body">
        <p class="card-tag">Nivel fundación</p>
        <h3>El Omelet de la Calma</h3>
        <p>Simple, clásico, perfecto. Dos huevos, mantequilla, sal. La base de todo.</p>
        <div class="card-steps">
          <div class="step"><span class="step-num">1</span><span>Batir los huevos con una pizca de sal hasta que estén homogéneos</span></div>
          <div class="step"><span class="step-num">2</span><span>Calentar la sartén a fuego medio-bajo con mantequilla</span></div>
          <div class="step"><span class="step-num">3</span><span>Verter y mover suavemente hasta que cuaje pero quede cremoso</span></div>
          <div class="step"><span class="step-num">4</span><span>Plegar con amor. Servir. Respirar.</span></div>
        </div>
      </div>
    </div>
 
    <div class="card reveal">
      <div class="card-thumb card-thumb-2">🌿</div>
      <div class="card-body">
        <p class="card-tag">Nivel armonía</p>
        <h3>El Omelet de las Hierbas</h3>
        <p>Cebollín, perejil, albahaca fresca. Para cuando la paz tiene aroma a jardín.</p>
        <div class="card-steps">
          <div class="step"><span class="step-num">1</span><span>Picar finamente las hierbas mientras meditas en lo bueno del día</span></div>
          <div class="step"><span class="step-num">2</span><span>Integrar al batido con un toque de crema o leche</span></div>
          <div class="step"><span class="step-num">3</span><span>Cocinar lento — la prisa es el enemigo del omelet y de la paz</span></div>
