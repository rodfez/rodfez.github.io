<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rodfez — Paz & Omelets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --cream:   #f5f0e8;
      --warm:    #e8d9c0;
      --yolk:    #e8a020;
      --yolk-deep: #c47a10;
      --sage:    #7a9e7e;
      --sage-deep: #4f7253;
      --ink:     #1e1a14;
      --muted:   #6b6358;
      --white:   #fffdf7;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    html { scroll-behavior: smooth; }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow-x: hidden;
    }
 
    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }
 
    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 2rem clamp(1.5rem, 6vw, 5rem);
      position: relative;
      overflow: hidden;
    }
 
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 80% 20%, rgba(232,160,32,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(122,158,126,0.20) 0%, transparent 55%),
        var(--cream);
      z-index: 0;
    }
 
    /* big decorative circle — yolk */
    .hero-bg::after {
      content: '';
      position: absolute;
      width: clamp(300px, 45vw, 600px);
      height: clamp(300px, 45vw, 600px);
      border-radius: 50%;
      border: 2px solid rgba(232,160,32,0.25);
      top: 50%;
      right: -8%;
      transform: translateY(-50%);
      animation: rotateSlow 30s linear infinite;
    }
 
    @keyframes rotateSlow { to { transform: translateY(-50%) rotate(360deg); } }
 
    nav {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(30,26,20,0.12);
    }
 
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
 
    .logo span { color: var(--yolk); }
 
    nav ul {
      list-style: none;
      display: flex;
      gap: 2.2rem;
    }
 
    nav a {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.25s;
    }
 
    nav a:hover { color: var(--yolk-deep); }
 
    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0 2rem;
      max-width: 720px;
    }
 
    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage-deep);
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }
 
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.08;
      font-weight: 700;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: fadeUp 0.9s 0.4s forwards;
    }
 
    h1 em {
      font-style: italic;
      color: var(--yolk-deep);
    }
 
    .hero-sub {
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
      color: var(--muted);
      max-width: 520px;
      margin-bottom: 2.8rem;
      font-weight: 300;
      opacity: 0;
      animation: fadeUp 0.9s 0.6s forwards;
    }
 
    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.9s 0.8s forwards;
    }
 
    .btn {
      display: inline-block;
      padding: 0.9rem 2rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
 
    .btn:hover { transform: translateY(-2px); }
 
    .btn-primary {
      background: var(--yolk);
      color: var(--ink);
      box-shadow: 0 4px 20px rgba(232,160,32,0.35);
    }
 
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(232,160,32,0.45); }
 
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid rgba(30,26,20,0.3);
    }
 
    .btn-secondary:hover { border-color: var(--sage); color: var(--sage-deep); }
 
    /* floating egg illustration */
    .egg-float {
      position: absolute;
      right: clamp(2rem, 10vw, 8rem);
      top: 50%;
      transform: translateY(-55%);
      z-index: 2;
      width: clamp(200px, 28vw, 380px);
      animation: float 6s ease-in-out infinite;
      opacity: 0;
      animation: float 6s ease-in-out infinite, fadeIn 1s 1s forwards;
    }
 
    @keyframes float {
      0%, 100% { transform: translateY(-55%); }
      50%       { transform: translateY(-62%); }
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
 
    .hero-scroll {
      position: relative;
      z-index: 2;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding-bottom: 1.5rem;
    }
 
    .hero-scroll::before {
      content: '';
      display: block;
      width: 1px;
      height: 40px;
      background: var(--muted);
      animation: scrollLine 2s ease-in-out infinite;
    }
 
    @keyframes scrollLine {
      0%,100% { opacity: 0.3; height: 40px; }
      50%      { opacity: 1;   height: 56px; }
    }
 
    /* ── SECTIONS SHARED ── */
    section {
      padding: clamp(4rem, 10vw, 8rem) clamp(1.5rem, 6vw, 5rem);
    }
 
    .section-label {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1rem;
    }
 
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.15;
      margin-bottom: 1.4rem;
    }
 
    /* ── PAZ SECTION ── */
    .paz {
      background: var(--ink);
      color: var(--cream);
      position: relative;
      overflow: hidden;
    }
 
    .paz::before {
      content: 'PAZ';
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-size: clamp(12rem, 28vw, 22rem);
      font-weight: 700;
      color: rgba(255,255,255,0.03);
      right: -2rem;
      bottom: -3rem;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
 
    .paz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      max-width: 1100px;
    }
 
    @media (max-width: 700px) { .paz-grid { grid-template-columns: 1fr; gap: 2.5rem; } }
 
    .paz .section-label { color: var(--sage); }
 
    .paz h2 { color: var(--white); }
 
    .paz p {
      color: rgba(245,240,232,0.65);
      line-height: 1.8;
      font-size: 1.05rem;
      font-weight: 300;
    }
 
    .peace-pillars {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
 
    .pillar {
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
      padding: 1.4rem 1.6rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.3s, transform 0.3s;
    }
 
    .pillar:hover {
      background: rgba(232,160,32,0.08);
      transform: translateX(6px);
    }
 
    .pillar-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
 
    .pillar h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--white);
      margin-bottom: 0.3rem;
    }
 
    .pillar p {
      font-size: 0.9rem;
      color: rgba(245,240,232,0.5);
    }
 
    /* ── OMELET SECTION ── */
    .omelet {
      background: var(--white);
      position: relative;
    }
 
    .omelet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 3.5rem;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
 
    .omelet-header p {
      color: var(--muted);
      max-width: 400px;
      line-height: 1.7;
      font-size: 1rem;
    }
 
    .recipe-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.6rem;
    }
 
    .card {
      border-radius: 16px;
      overflow: hidden;
      background: var(--cream);
      border: 1px solid var(--warm);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: default;
    }
 
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(30,26,20,0.12);
    }
 
    .card-thumb {
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      position: relative;
      overflow: hidden;
    }
 
    .card-thumb-1 { background: linear-gradient(135deg, #fde68a, #fbbf24); }
    .card-thumb-2 { background: linear-gradient(135deg, #bbf7d0, #6ee7b7); }
    .card-thumb-3 { background: linear-gradient(135deg, #fecaca, #f87171); }
 
    .card-body { padding: 1.4rem 1.6rem 1.8rem; }
 
    .card-tag {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--yolk-deep);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
 
    .card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 0.6rem;
    }
 
    .card p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.65;
    }
 
    .card-steps {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
 
    .step {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
 
    .step-num {
      background: var(--yolk);
      color: var(--ink);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
 
    /* ── MANIFIESTO ── */
    .manifiesto {
      background: var(--sage);
      color: var(--white);
      text-align: center;
      padding: clamp(5rem, 12vw, 10rem) clamp(1.5rem, 6vw, 5rem);
      position: relative;
      overflow: hidden;
    }
 
    .manifiesto::before {
      content: '☮';
      position: absolute;
      font-size: clamp(18rem, 40vw, 32rem);
      opacity: 0.06;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
 
    .manifiesto .section-label { color: rgba(255,255,255,0.6); }
 
    .manifiesto h2 {
      color: var(--white);
      max-width: 700px;
      margin: 0 auto 1.6rem;
    }
 
    .manifiesto p {
      color: rgba(255,255,255,0.75);
      font-size: 1.1rem;
      line-height: 1.8;
      max-width: 560px;
      margin: 0 auto 2.5rem;
      font-weight: 300;
    }
 
    .quote-mark {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      color: rgba(255,255,255,0.25);
      line-height: 0.5;
      display: block;
      margin-bottom: 1.5rem;
    }
 
    /* ── SOBRE MÍ ── */
    .sobre {
      background: var(--cream);
    }
 
    .sobre-inner {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 5rem;
      align-items: center;
      max-width: 1000px;
    }
 
    @media (max-width: 720px) { .sobre-inner { grid-template-columns: 1fr; gap: 3rem; } }
 
    .sobre-avatar {
      aspect-ratio: 1;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      background: linear-gradient(135deg, var(--yolk) 0%, var(--sage) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(4rem, 10vw, 7rem);
      animation: morphShape 8s ease-in-out infinite;
      max-width: 280px;
    }
 
    @keyframes morphShape {
      0%,100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      25%      { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
      50%      { border-radius: 50% 50% 30% 70% / 60% 40% 60% 40%; }
      75%      { border-radius: 40% 60% 70% 30% / 40% 50% 50% 60%; }
    }
 
    .sobre h2 { margin-bottom: 1.2rem; }
 
    .sobre p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 1rem;
      margin-bottom: 1.2rem;
    }
 
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.8rem;
    }
 
    .tag {
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
 
    .tag-yolk { background: rgba(232,160,32,0.15); color: var(--yolk-deep); }
    .tag-sage { background: rgba(122,158,126,0.15); color: var(--sage-deep); }
 
    /* ── FOOTER ── */
    footer {
      background: var(--ink);
      color: rgba(245,240,232,0.45);
      text-align: center;
      padding: 3rem clamp(1.5rem, 6vw, 5rem);
      font-size: 0.85rem;
      line-height: 1.8;
    }
 
    footer .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--white);
      display: block;
      margin-bottom: 0.5rem;
    }
 
    footer span { color: var(--yolk); }
 
    /* ── SCROLL REVEAL ── */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
 
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
 
    /* ── MOBILE NAV ── */
    @media (max-width: 600px) {
      nav ul { display: none; }
      .egg-float { display: none; }
    }
  </style>
</head>
<body>
 
<!-- ═══ HERO ═══ -->
<section class="hero">
  <div class="hero-bg"></div>
 
  <nav>
    <div class="logo">rod<span>fez</span></div>
    <ul>
      <li><a href="#paz">Paz</a></li>
      <li><a href="#omelets">Omelets</a></li>
      <li><a href="#manifiesto">Manifiesto</a></li>
      <li><a href="#sobre">Sobre mí</a></li>
    </ul>
  </nav>
 
  <!-- SVG omelet illustration flotando -->
  <svg class="egg-float" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- pan -->
    <ellipse cx="170" cy="290" rx="150" ry="22" fill="rgba(30,26,20,0.08)"/>
    <rect x="50" y="200" width="240" height="14" rx="7" fill="#4a3f2f"/>
    <ellipse cx="170" cy="200" rx="120" ry="18" fill="#3a2f1f"/>
    <!-- huevo blanco -->
    <ellipse cx="170" cy="185" rx="100" ry="70" fill="#fefce8"/>
    <ellipse cx="150" cy="190" rx="72" ry="55" fill="#fffdf7"/>
    <!-- yema -->
    <circle cx="155" cy="180" r="36" fill="#f59e0b"/>
    <circle cx="155" cy="180" r="28" fill="#fbbf24"/>
    <circle cx="148" cy="172" r="8" fill="rgba(255,255,255,0.35)"/>
    <!-- hierbas -->
    <ellipse cx="220" cy="200" rx="12" ry="5" fill="#6ee7b7" transform="rotate(-20 220 200)"/>
    <ellipse cx="235" cy="193" rx="10" ry="4" fill="#34d399" transform="rotate(10 235 193)"/>
